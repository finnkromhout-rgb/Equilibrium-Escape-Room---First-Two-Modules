<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackice Outpost Terminal</title>
    <script src="https://cdn.jsdelivr.net/gh/iddi/oocsi-websocket@master/dist/oocsi-web.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-void:#0b0a07; --steel:#2c2d26; --steel-lo:#211f1a; --steel-hi:#3d3e34;
            --rust:#7c4a2d; --amber:#ffb400; --amber-dim:#8a6000; --hazard:#d9a400; --hazard-dk:#17140f;
            --warn:#c23b22; --paper:#e4d9ae; --ok:#7fbf5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'IBM Plex Mono', monospace;
            background: radial-gradient(ellipse at 50% -10%, #241f16 0%, transparent 60%), linear-gradient(180deg, var(--bg-void), #060504);
            color: var(--amber);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px;
            overflow-x: hidden;
        }
        .container {
            position: relative; width: 100%; max-width: 720px;
            background: repeating-linear-gradient(180deg, rgba(0,0,0,0.15) 0 2px, transparent 2px 4px), linear-gradient(160deg, var(--steel-hi), var(--steel) 40%, var(--steel-lo));
            border: 1px solid #14130f; border-radius: 22px; padding: 24px;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.04), inset 0 0 40px rgba(0,0,0,0.4);
        }
        .rivet { position:absolute; width:10px; height:10px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #6b6b5e, #131209 70%); z-index:5; }
        .rivet.tl{top:10px;left:10px;} .rivet.tr{top:10px;right:10px;} .rivet.bl{bottom:10px;left:10px;} .rivet.br{bottom:10px;right:10px;}
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #14130f; padding-bottom: 12px; margin-bottom: 20px; }
        .title { font-family:'Big Shoulders Stencil', sans-serif; font-weight:800; font-size: 20px; letter-spacing:0.04em; color:#e9dcb8; text-shadow:0 1px 0 #000; }
        .status-dot { height: 9px; width: 9px; background: var(--warn); border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow:0 0 8px var(--warn); }
        .status-dot.connected { background: var(--ok); box-shadow:0 0 8px var(--ok); animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        .hazard-strip { height: 8px; background: repeating-linear-gradient(135deg, var(--hazard) 0 12px, var(--hazard-dk) 12px 24px); margin-bottom: 24px; opacity:0.85; }
        .screen { display: none; }
        .screen.active { display: block; }

        /* --- Lock screen --- */
        .lock-container { text-align: center; padding: 12px 0 4px; max-width: 400px; margin: 0 auto; }
        .lock-container h2 { font-family:'Big Shoulders Stencil', sans-serif; font-weight:600; font-size: 18px; letter-spacing:0.06em; color:#cfc39a; margin-bottom: 24px; }
        .dials { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .dial { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .dial-btn { width: 34px; height: 26px; background: var(--steel-hi); border: 1px solid #14130f; color: var(--amber); font-size: 12px; cursor: pointer; border-radius: 3px; }
        .dial-btn:active { background: var(--rust); }
        .dial-val { width: 34px; height: 44px; background: #0a0906; border: 1px solid #000; border-radius: 2px; display:flex; align-items:center; justify-content:center; font-size: 22px; font-weight:600; color: var(--amber); text-shadow: 0 0 6px rgba(255,180,0,0.4); box-shadow: inset 0 0 8px rgba(0,0,0,0.8); }
        .submit-btn { background: var(--rust); color: #fff; border: none; padding: 10px 28px; font-size: 0.95rem; font-weight: 600; border-radius: 4px; cursor: pointer; letter-spacing: 0.06em; margin-top: 6px; }
        .submit-btn:active { background: var(--amber-dim); }
        .error-msg { color: var(--warn); margin-top: 12px; font-size: 0.85rem; height: 18px; letter-spacing: 0.06em; }
        .lock-container.shake { animation: jolt 0.3s linear; }
        @keyframes jolt { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-4px,0);} 75%{transform:translate(4px,0);} }

        /* --- Home screen --- */
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
        .card { background: rgba(0,0,0,0.35); border: 1px solid rgba(0,0,0,0.5); border-radius: 4px; padding: 16px; text-align: center; }
        .card h3 { font-family:'Big Shoulders Stencil', sans-serif; font-weight:600; font-size: 13px; letter-spacing:0.08em; color:#cfc39a; margin-bottom: 8px; }
        .temp-val { font-size: 2rem; font-weight: 600; color: var(--amber); text-shadow: 0 0 6px rgba(255,180,0,0.4); }
        .manual-space { background: rgba(0,0,0,0.35); border: 2px dashed rgba(255,180,0,0.2); border-radius: 4px; padding: 22px; text-align: center; margin-top: 16px; }
        .manual-space h3 { font-family:'Big Shoulders Stencil', sans-serif; font-size: 13px; letter-spacing:0.08em; color:#cfc39a; margin-bottom: 10px; }
        .manual-space p { color: var(--amber-dim); font-size: 0.85rem; }
        .note { display:inline-block; margin-top:16px; background: var(--paper); color:#2c2410; font-family:'Caveat', cursive; font-size:17px; padding:8px 14px; transform: rotate(-1.5deg); box-shadow: 0 6px 12px rgba(0,0,0,0.5); }

        /* --- Signal tuning puzzle --- */
        .zone-track { position: relative; height: 16px; background: #0a0906; border-radius: 8px; margin: 0 10px 14px; box-shadow: inset 0 0 8px rgba(0,0,0,0.8); }
        .zone-fill { position: absolute; top: 0; height: 100%; background: rgba(127,191,94,0.4); border-radius: 8px; }
        .tune-slider { width: 90%; accent-color: var(--rust); }
        .tune-status { margin-top: 10px; font-size: 0.85rem; color: var(--amber-dim); letter-spacing: 0.04em; }
        .log-list { text-align: left; font-size: 0.85rem; color: var(--amber-dim); max-height: 100px; overflow-y: auto; }

        /* --- Broken-screen / storm interference effects --- */
        .crt-overlay {
            position: absolute; inset: 0; border-radius: 22px; pointer-events: none; z-index: 4;
            background:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse 90% 80% at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%);
            box-shadow: inset 0 0 60px 20px rgba(0,0,0,0.5);
        }
        .tear {
            position: absolute; left: 0; right: 0; height: 0; opacity: 0;
            background: rgba(255,255,255,0.08); mix-blend-mode: overlay; pointer-events: none; z-index: 6;
        }
        .tear.show { height: 5px; opacity: 1; }
        .container.glitch { animation: crtjolt 0.16s linear; }
        .container.glitch .title, .container.glitch .temp-val {
            text-shadow: 2px 0 rgba(255,60,30,0.5), -2px 0 rgba(0,180,255,0.4);
        }
        @keyframes crtjolt {
            0%{transform:translate(0,0);} 20%{transform:translate(-2px,1px) skewX(0.3deg);}
            40%{transform:translate(2px,-1px) skewX(-0.3deg);} 60%{transform:translate(-1px,1px);}
            100%{transform:translate(0,0);}
        }
        .container.flicker { animation: flick 0.12s steps(2); }
        @keyframes flick { 0%,100%{opacity:1;} 50%{opacity:0.55;} }
    </style>
</head>
<body>

    <div class="container" id="container">
        <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
        <div class="crt-overlay"></div>
        <div class="tear" id="tear"></div>

        <div class="top-bar">
            <div class="title"><span id="oocsiDot" class="status-dot"></span>BLACKICE OUTPOST TERMINAL</div>
        </div>
        <div class="hazard-strip"></div>

        <!-- LOCK SCREEN -->
        <div id="lockScreen" class="screen active">
            <div class="lock-container" id="lockBox">
                <h2>Enter access code</h2>
                <div class="dials" id="dials"></div>
                <button class="submit-btn" onclick="handlePinSubmit()">UNLOCK</button>
                <div id="errorMsg" class="error-msg"></div>
            </div>
        </div>

        <!-- HOME SCREEN -->
        <div id="homeScreen" class="screen">
            <div class="dashboard-grid">
                <div class="card">
                    <h3>Control room temp</h3>
                    <div id="tempDisplay" class="temp-val">-20 °C</div>
                </div>
            </div>

            <!-- shown while nothing is happening -->
            <div class="manual-space" id="lockedPanel">
                <h3>Signal locked</h3>
                <p id="lockedText">Awaiting activity from the boiler room...</p>
            </div>

            <!-- shown while the tuning puzzle is active -->
            <div class="manual-space" id="tunePanel" style="display:none;">
                <h3>Incoming transmission</h3>
                <p style="margin-bottom:10px;">Hold the signal in the clear band to transmit</p>
                <div class="zone-track">
                    <div class="zone-fill" id="zoneBar"></div>
                </div>
                <input type="range" id="tuneSlider" class="tune-slider" min="0" max="100" value="50" oninput="checkSignal(this.value)">
                <div class="tune-status" id="tuneProgress">signal: idle</div>
            </div>

            <div class="manual-space" id="logPanel">
                <h3>Transmission log</h3>
                <div class="log-list" id="logList">no signals sent yet</div>
            </div>

            <div class="note">stay calm, station<br>will stabilize &mdash; M.</div>
        </div>
    </div>

    <script>
        const CORRECT_PIN = "167874";
        const OOCSI_CHANNEL = "OOCSI-things/team-3";
        const digits = [0, 0, 0, 0, 0, 0];

        // build the mouse-only combination lock dials
        const dialsEl = document.getElementById('dials');
        digits.forEach((_, i) => {
            const dial = document.createElement('div');
            dial.className = 'dial';
            dial.innerHTML = `
                <button class="dial-btn" onclick="changeDigit(${i}, 1)">&#9650;</button>
                <div class="dial-val" id="dial-${i}">0</div>
                <button class="dial-btn" onclick="changeDigit(${i}, -1)">&#9660;</button>`;
            dialsEl.appendChild(dial);
        });

        function changeDigit(i, dir) {
            digits[i] = (digits[i] + dir + 10) % 10;
            document.getElementById('dial-' + i).textContent = digits[i];
        }

        function handlePinSubmit() {
            const entered = digits.join('');
            if (entered === CORRECT_PIN) {
                document.getElementById('errorMsg').textContent = '';
                document.getElementById('lockScreen').classList.remove('active');
                document.getElementById('homeScreen').classList.add('active');
                newRound();
            } else {
                const box = document.getElementById('lockBox');
                document.getElementById('errorMsg').textContent = 'ACCESS DENIED';
                box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
            }
        }

        // --- Signal tuning puzzle ---
        let zoneMin = 40, zoneMax = 60;
        let lockProgress = 0;
        let lockTimer = null;
        let pendingStep = 1;
        let log = [];

        function newRound() {
            zoneMin = 20 + Math.random() * 40;
            zoneMax = zoneMin + 12;
            document.getElementById('zoneBar').style.left = zoneMin + '%';
            document.getElementById('zoneBar').style.width = (zoneMax - zoneMin) + '%';
            lockProgress = 0;
            document.getElementById('tuneSlider').value = 50;
            document.getElementById('tuneProgress').textContent = 'signal: idle';
            document.getElementById('lockedPanel').style.display = 'none';
            document.getElementById('tunePanel').style.display = 'block';
        }

        function checkSignal(v) {
            const inZone = v >= zoneMin && v <= zoneMax;
            if (inZone && !lockTimer) {
                lockTimer = setInterval(() => {
                    lockProgress += 100 / 15; // ~1.5s to lock
                    document.getElementById('tuneProgress').textContent = 'signal: ' + Math.min(100, Math.round(lockProgress)) + '%';
                    if (lockProgress >= 100) {
                        clearInterval(lockTimer);
                        lockTimer = null;
                        lockSignal();
                    }
                }, 100);
            } else if (!inZone && lockTimer) {
                clearInterval(lockTimer);
                lockTimer = null;
                lockProgress = 0;
                document.getElementById('tuneProgress').textContent = 'signal: lost — hold steady';
            }
        }

        function lockSignal() {
            OOCSI.send(OOCSI_CHANNEL, { unlock_next: pendingStep });
            document.getElementById('tunePanel').style.display = 'none';
            document.getElementById('lockedPanel').style.display = 'block';
            document.getElementById('lockedText').textContent = 'Transmitting...';
        }

        function addLogEntry(text) {
            log.unshift(text);
            document.getElementById('logList').innerHTML = log.map(l => `<div>${l}</div>`).join('');
        }

        // OOCSI connection
        OOCSI.connect('wss://oocsi.id.tue.nl/ws');

        OOCSI.subscribe(OOCSI_CHANNEL, function(msg) {
            document.getElementById('oocsiDot').classList.add('connected');

            if (msg.data && msg.data.temp !== undefined) {
                document.getElementById('tempDisplay').innerText = msg.data.temp + " °C";
            }
            if (msg.data && msg.data.revealed_step !== undefined) {
                addLogEntry('STEP ' + msg.data.revealed_step + ': ' + msg.data.revealed_pressure.toFixed(1) + ' BAR');
                document.getElementById('lockedText').textContent = 'Signal sent — awaiting boiler room';
            }
            if (msg.data && msg.data.step_done !== undefined) {
                pendingStep = msg.data.step_done + 1;
                setTimeout(newRound, 1200);
            }
        });

        // --- Storm interference: random screen jolts, tear lines, and flickers ---
        const container = document.getElementById('container');
        const tear = document.getElementById('tear');

        function stormEffect() {
            const roll = Math.random();
            if (roll < 0.5) {
                container.classList.add('glitch');
                tear.style.top = Math.random() * 90 + '%';
                tear.classList.add('show');
                setTimeout(() => {
                    container.classList.remove('glitch');
                    tear.classList.remove('show');
                }, 160);
            } else {
                container.classList.add('flicker');
                setTimeout(() => container.classList.remove('flicker'), 120);
            }
            setTimeout(stormEffect, 2500 + Math.random() * 5000);
        }
        setTimeout(stormEffect, 1500);
    </script>
</body>
</html>
